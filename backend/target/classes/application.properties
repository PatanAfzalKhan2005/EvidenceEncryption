spring.application.name=imageseal

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/imageseal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Image Storage Configuration
imageseal.storage-dir=${IMAGE_STORAGE_DIR:../storage/images}

# Encryption Configuration
imageseal.encryption-key=${IMAGE_ENCRYPTION_KEY:}

# JWT Security Configuration
imageseal.jwt-secret=${JWT_SECRET:}
imageseal.jwt-expiration-ms=86400000

# Server Configuration
server.port=8081
